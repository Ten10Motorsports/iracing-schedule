name: Race notifications

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Send this slot now, ignoring the clock (morning / evening)"
        required: false
        default: ""
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: race-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Send due notifications
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then ARGS="$ARGS --force ${{ github.event.inputs.slot }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/notify.mjs $ARGS

      - name: Record what was sent
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -n "$(git status --porcelain data/sent.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sent.json
            git commit -m "chore: record sent notifications [skip ci]"
            git push
          else
            echo "Nothing to record."
          fi
